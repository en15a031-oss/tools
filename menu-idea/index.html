<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新メニューアイデアジェネレーター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #fafaf8;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 36px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }

    /* スロット */
    .slots-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .slot {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px dashed #b3cfe8;
      background: #f0f6fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 12px;
      transition: border-color 0.15s, background 0.15s;
      text-align: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .slot:hover { border-color: #7aafd4; background: #e4f0fa; }
    .slot.filled { border-style: solid; border-color: #4a8fc0; background: #e4f0fa; }

    .slot-type {
      font-size: 0.6rem;
      font-weight: 600;
      color: #7aafd4;
      letter-spacing: 0.06em;
    }

    .slot-value {
      font-size: 0.85rem;
      font-weight: 700;
      color: #7aafd4;
      line-height: 1.3;
      word-break: break-all;
    }
    .slot.filled .slot-type { color: #3a7ab0; }
    .slot.filled .slot-value { color: #1a3f5c; }

    .slot-cross {
      font-size: 1.4rem;
      font-weight: 300;
      color: #ccc;
      flex-shrink: 0;
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      background: #2c2c2c;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s;
      margin-bottom: 20px;
    }
    .generate-btn:hover { background: #444; }

    /* 結果 */
    .result-hint {
      font-size: 0.78rem;
      color: #aaa;
      text-align: center;
      padding: 20px 0;
    }

    .bubble-area {
      position: relative;
      width: 100%;
      height: 340px;
    }

    .bubble {
      position: absolute;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 14px;
      background: #fff;
      box-shadow:
        0 0 0 2px rgba(190, 210, 245, 0.25),
        0 0 14px 7px rgba(180, 205, 240, 0.28),
        0 0 32px 16px rgba(180, 205, 240, 0.12);
    }

    .bubble:nth-child(1) { left: calc(20% - 59px); top: 8px; }
    .bubble:nth-child(2) { left: calc(80% - 59px); top: 4px; }
    .bubble:nth-child(3) { left: calc(50% - 59px); top: 111px; }
    .bubble:nth-child(4) { left: calc(20% - 59px); top: 214px; }
    .bubble:nth-child(5) { left: calc(80% - 59px); top: 210px; }

    .b-a { font-size: 0.78rem; font-weight: 700; color: #1a1a1a; line-height: 1.3; word-break: break-all; }
    .b-sep { font-size: 0.62rem; color: #ccc; margin: 3px 0; }
    .b-b { font-size: 0.78rem; font-weight: 700; color: #1a1a1a; line-height: 1.3; word-break: break-all; }

    /* ボトムシート */
    .sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 200;
    }
    .sheet-overlay.open { display: block; }

    .sheet {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 20px 20px 0 0;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      z-index: 201;
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .sheet.open { transform: translateX(-50%) translateY(0); }

    .sheet-sticky {
      padding: 20px 20px 0;
      flex-shrink: 0;
    }

    .sheet-body {
      overflow-y: auto;
      padding: 0 20px 40px;
      flex: 1;
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 8px;
    }
    .sheet-title {
      font-size: 1rem;
      font-weight: 700;
      flex: 1;
    }
    .sheet-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: #aaa;
      line-height: 1;
      padding: 4px;
    }
    .sheet-confirm-top {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      background: #2c2c2c;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 食材 / 料理名 切り替え */
    .type-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .type-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1.5px solid #ddd;
      background: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      color: #888;
      transition: all 0.12s;
    }
    .type-btn.active {
      background: #2c2c2c;
      border-color: #2c2c2c;
      color: #fff;
    }

    /* チェックボックスリスト */
    .cat-block { margin-bottom: 4px; }

    .cat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.1s;
    }
    .cat-row:hover { background: #f5f5f3; }

    .cat-label {
      font-size: 0.9rem;
      font-weight: 700;
      flex: 1;
    }

    .cat-toggle {
      font-size: 0.8rem;
      color: #aaa;
    }

    .sub-list {
      padding-left: 16px;
      padding-bottom: 6px;
      display: none;
    }
    .sub-list.open { display: block; }

    .sub-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.1s;
    }
    .sub-row:hover { background: #f5f5f3; }

    .sub-label {
      font-size: 0.85rem;
      color: #444;
      flex: 1;
    }

    /* カスタムチェックボックス */
    .cb {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      border: 2px solid #ddd;
      background: #fff;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }
    .cb.checked {
      background: #2c2c2c;
      border-color: #2c2c2c;
    }
    .cb.checked::after {
      content: '';
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
      display: block;
    }
    .cb.indeterminate {
      background: #888;
      border-color: #888;
    }
    .cb.indeterminate::after {
      content: '';
      width: 10px;
      height: 2px;
      background: #fff;
      display: block;
    }

    /* 料理名フィルター セクションラベル */
    .filter-section-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #aaa;
      margin: 12px 0 6px;
    }

    /* 料理名チェックリスト */
    .origin-list { padding: 4px 0; }
    .origin-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.1s;
    }
    .origin-row:hover { background: #f5f5f3; }
    .origin-label { font-size: 0.9rem; font-weight: 600; flex: 1; }

    /* シートフッター */
    .sheet-footer {
      margin-top: 20px;
    }
    .sheet-reset {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid #ddd;
      background: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      color: #aaa;
    }

    /* 季節フィルター */
    .season-pills {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .season-pill {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1.5px solid #ddd;
      background: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      color: #888;
      transition: all 0.12s;
    }
    .season-pill.active {
      background: #2c2c2c;
      border-color: #2c2c2c;
      color: #fff;
    }

    /* 食材検索結果 */
    .ing-cat-label {
      font-size: 0.7rem;
      color: #bbb;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .no-result {
      font-size: 0.85rem;
      color: #bbb;
      text-align: center;
      padding: 20px 0;
    }

    /* 食材検索 */
    .ingredient-search {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid #ddd;
      background: #f9f9f7;
      font-size: 0.88rem;
      outline: none;
      margin-bottom: 12px;
      box-sizing: border-box;
      transition: border-color 0.12s, background 0.12s;
    }
    .ingredient-search:focus {
      border-color: #aaa;
      background: #fff;
    }
  </style>
</head>
<body>

  <h1>新メニューアイデア</h1>
  <p class="subtitle">ランダムな組み合わせから発想のきっかけを</p>

  <div class="card">
    <div class="slots-row">
      <div class="slot" id="slot-a" onclick="openSheet(0)">
        <div class="slot-type" id="slot-a-type">食材 / 料理名</div>
        <div class="slot-value" id="slot-a-value">？</div>
      </div>
      <div class="slot-cross">×</div>
      <div class="slot" id="slot-b" onclick="openSheet(1)">
        <div class="slot-type" id="slot-b-type">食材 / 料理名</div>
        <div class="slot-value" id="slot-b-value">？</div>
      </div>
    </div>

    <button class="generate-btn" onclick="generate()">アイデアを出す</button>

    <div id="result-area">
      <div class="result-hint">ボタンを押すと組み合わせが出ます</div>
    </div>
  </div>

  <!-- ボトムシート -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-sticky">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title" id="sheet-title">スロットを設定</div>
        <button class="sheet-confirm-top" onclick="confirmSheet()">決定</button>
        <button class="sheet-close" onclick="closeSheet()">×</button>
      </div>
    </div>

    <div class="sheet-body">
      <div class="type-toggle">
        <button class="type-btn active" id="type-btn-ingredient" onclick="setSheetType('ingredient')">食材</button>
        <button class="type-btn" id="type-btn-dish" onclick="setSheetType('dish')">料理名</button>
      </div>

      <!-- 食材検索 -->
      <input type="text" id="ingredient-search" class="ingredient-search"
             placeholder="食材を検索..." oninput="onIngredientSearch(this.value)" style="display:none">

      <!-- 季節フィルター -->
      <div id="season-pills" class="season-pills" style="display:none">
        <button class="season-pill active" id="pill-all" onclick="setSeasonFilter(null)">すべて</button>
        <button class="season-pill" id="pill-春" onclick="setSeasonFilter('春')">春</button>
        <button class="season-pill" id="pill-夏" onclick="setSeasonFilter('夏')">夏</button>
        <button class="season-pill" id="pill-秋" onclick="setSeasonFilter('秋')">秋</button>
        <button class="season-pill" id="pill-冬" onclick="setSeasonFilter('冬')">冬</button>
      </div>

      <!-- 食材チェックリスト -->
      <div id="ingredient-list"></div>

      <!-- 料理名フィルター（温度・コース・調理法） -->
      <div id="dish-filter-area" style="display:none">
        <div class="filter-section-label">温度</div>
        <div class="season-pills" id="dish-temp-pills">
          <button class="season-pill active" data-val="null" onclick="setDishFilter('temp', null)">すべて</button>
          <button class="season-pill" data-val="温" onclick="setDishFilter('temp', '温')">温</button>
          <button class="season-pill" data-val="冷" onclick="setDishFilter('temp', '冷')">冷</button>
        </div>
        <div class="filter-section-label">コース</div>
        <div class="season-pills" id="dish-course-pills">
          <button class="season-pill active" data-val="null" onclick="setDishFilter('course', null)">すべて</button>
          <button class="season-pill" data-val="前菜" onclick="setDishFilter('course', '前菜')">前菜</button>
          <button class="season-pill" data-val="スープ" onclick="setDishFilter('course', 'スープ')">スープ</button>
          <button class="season-pill" data-val="メイン" onclick="setDishFilter('course', 'メイン')">メイン</button>
          <button class="season-pill" data-val="副菜" onclick="setDishFilter('course', '副菜')">副菜</button>
        </div>
        <div class="filter-section-label">調理法</div>
        <div class="season-pills" id="dish-method-pills">
          <button class="season-pill active" data-val="null" onclick="setDishFilter('method', null)">すべて</button>
          <button class="season-pill" data-val="生食" onclick="setDishFilter('method', '生食')">生食</button>
          <button class="season-pill" data-val="焼く" onclick="setDishFilter('method', '焼く')">焼く</button>
          <button class="season-pill" data-val="煮る" onclick="setDishFilter('method', '煮る')">煮る</button>
          <button class="season-pill" data-val="蒸す" onclick="setDishFilter('method', '蒸す')">蒸す</button>
          <button class="season-pill" data-val="揚げる" onclick="setDishFilter('method', '揚げる')">揚げる</button>
          <button class="season-pill" data-val="和える" onclick="setDishFilter('method', '和える')">和える</button>
          <button class="season-pill" data-val="炒める" onclick="setDishFilter('method', '炒める')">炒める</button>
        </div>
      </div>

      <!-- 料理名チェックリスト -->
      <div id="dish-list" style="display:none"></div>

      <div class="sheet-footer">
        <button class="sheet-reset" onclick="resetSheet()">リセット</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    // スロット状態 { type: 'ingredient'|'dish', checks: Set }
    const slots = [
      { type: 'ingredient', checks: new Set(), seasonFilter: null, dishTempFilter: null, dishCourseFilter: null, dishMethodFilter: null },
      { type: 'dish',       checks: new Set(), seasonFilter: null, dishTempFilter: null, dishCourseFilter: null, dishMethodFilter: null },
    ];

    let currentSlot = 0;
    let sheetType = 'ingredient';

    // カテゴリの開閉状態
    const catOpen = {};

    let searchText = '';

    // ---- シート開閉 ----
    function openSheet(slotIndex) {
      currentSlot = slotIndex;
      sheetType = slots[slotIndex].type;
      searchText = '';
      document.getElementById('ingredient-search').value = '';
      document.getElementById('sheet-title').textContent = `スロット${slotIndex === 0 ? 'A' : 'B'} を設定`;
      document.getElementById('sheet-overlay').classList.add('open');
      document.getElementById('sheet').classList.add('open');
      syncSeasonPills();
      syncDishPills();
      renderSheetType();
      renderIngredientList();
      renderDishList();
    }

    function closeSheet() {
      document.getElementById('sheet-overlay').classList.remove('open');
      document.getElementById('sheet').classList.remove('open');
    }

    // ---- タイプ切り替え ----
    function setSheetType(type) {
      sheetType = type;
      renderSheetType();
    }

    function renderSheetType() {
      document.getElementById('type-btn-ingredient').classList.toggle('active', sheetType === 'ingredient');
      document.getElementById('type-btn-dish').classList.toggle('active', sheetType === 'dish');
      document.getElementById('ingredient-list').style.display = sheetType === 'ingredient' ? '' : 'none';
      document.getElementById('dish-list').style.display = sheetType === 'dish' ? '' : 'none';
      document.getElementById('season-pills').style.display = sheetType === 'ingredient' ? '' : 'none';
      document.getElementById('ingredient-search').style.display = sheetType === 'ingredient' ? '' : 'none';
      document.getElementById('dish-filter-area').style.display = sheetType === 'dish' ? '' : 'none';
    }

    function syncDishPills() {
      const slot = slots[currentSlot];
      [
        ['dish-temp-pills',   'dishTempFilter'],
        ['dish-course-pills', 'dishCourseFilter'],
        ['dish-method-pills', 'dishMethodFilter'],
      ].forEach(([id, key]) => {
        const val = slot[key];
        document.getElementById(id).querySelectorAll('.season-pill').forEach(btn => {
          btn.classList.toggle('active', (btn.dataset.val === 'null' ? null : btn.dataset.val) === val);
        });
      });
    }

    function setDishFilter(dim, value) {
      const key = dim === 'temp' ? 'dishTempFilter' : dim === 'course' ? 'dishCourseFilter' : 'dishMethodFilter';
      slots[currentSlot][key] = value;
      syncDishPills();
      renderDishList();
      updateSlotDisplay(currentSlot);
    }

    function onIngredientSearch(val) {
      searchText = val.trim();
      renderIngredientList();
    }

    // ひらがな→カタカナに統一して比較（表記ゆれ対応）
    function normalizeJP(str) {
      return str.toLowerCase().replace(/[ぁ-ゖ]/g, ch =>
        String.fromCharCode(ch.charCodeAt(0) + 0x60)
      );
    }

    // 漢字→読みの文字単位変換マップ（長いものを先に置く）
    const CHAR_MAP = [
      ['骨髄', 'コツズイ'], ['軟骨', 'ナンコツ'], ['手羽', 'テバ'],
      ['大根', 'ダイコン'], ['白菜', 'ハクサイ'],
      ['豚', 'ブタ'], ['鶏', 'トリ'], ['牛', 'ギュウ'],
      ['鴨', 'カモ'], ['鹿', 'シカ'], ['猪', 'イノシシ'],
      ['馬', 'ウマ'], ['兎', 'ウサギ'], ['鳩', 'ハト'],
      ['肉', 'ニク'], ['皮', 'カワ'], ['骨', 'ホネ'],
      ['足', 'アシ'], ['耳', 'ミミ'], ['頬', 'ホホ'],
      ['胸', 'ムネ'], ['菊', 'キク'], ['花', 'ハナ'],
      ['砂', 'スナ'],
    ];

    // 食材名の漢字を読みに変換してから正規化
    function normalizeIngName(name) {
      let s = name;
      for (const [kanji, kana] of CHAR_MAP) {
        s = s.split(kanji).join(kana);
      }
      return normalizeJP(s);
    }

    // 食材名が検索ワードにマッチするか（読みがな・漢字置換も考慮）
    function ingMatches(ing, st) {
      if (normalizeJP(ing.name).includes(st)) return true;
      if (normalizeIngName(ing.name).includes(st)) return true;
      const yomi = DATA.yomi[ing.name];
      if (yomi && normalizeJP(yomi).includes(st)) return true;
      return false;
    }

    function syncSeasonPills() {
      const sf = slots[currentSlot].seasonFilter;
      document.getElementById('pill-all').classList.toggle('active', sf === null);
      ['春', '夏', '秋', '冬'].forEach(s => {
        document.getElementById('pill-' + s).classList.toggle('active', sf === s);
      });
    }

    function setSeasonFilter(season) {
      slots[currentSlot].seasonFilter = season;
      syncSeasonPills();
      renderIngredientList();
    }

    function getFilteredCategories() {
      const sf = slots[currentSlot].seasonFilter;
      const st = normalizeJP(searchText);

      let pool = DATA.ingredients;
      if (sf) {
        pool = pool.filter(ing => ing.seasons.includes(sf) || ing.seasons.includes('通年'));
      }

      return DATA.categories.map(cat => {
        const catIngs = pool.filter(ing => ing.category === cat.name);
        if (catIngs.length === 0) return null;

        if (!st) {
          const availableSubs = cat.subs.filter(sub => catIngs.some(ing => ing.sub === sub));
          return { name: cat.name, subs: availableSubs };
        }

        // カテゴリ名がヒットする場合は配下のサブをすべて表示
        if (normalizeJP(cat.name).includes(st)) {
          const availableSubs = cat.subs.filter(sub => catIngs.some(ing => ing.sub === sub));
          return { name: cat.name, subs: availableSubs };
        }

        // サブ名 or 食材名がヒットするサブのみ表示
        const matchingSubs = cat.subs.filter(sub => {
          if (normalizeJP(sub).includes(st)) return catIngs.some(ing => ing.sub === sub);
          return catIngs.filter(ing => ing.sub === sub).some(ing => ingMatches(ing, st));
        });

        if (matchingSubs.length === 0) return null;
        return { name: cat.name, subs: matchingSubs };
      }).filter(Boolean);
    }

    // ---- 食材リスト描画 ----
    function renderIngredientList() {
      const checks = slots[currentSlot].type === 'ingredient' ? slots[currentSlot].checks : new Set();
      const container = document.getElementById('ingredient-list');
      container.innerHTML = '';

      // 検索中は食材名フラットリストを表示
      if (searchText) {
        renderIngredientSearchResults(container, checks);
        return;
      }

      const filteredCats = getFilteredCategories();
      filteredCats.forEach(cat => {
        const block = document.createElement('div');
        block.className = 'cat-block';

        // カテゴリの選択状態
        const subKeys = cat.subs.map(s => cat.name + '::' + s);
        const allChecked = cat.subs.length === 0
          ? checks.has(cat.name)
          : subKeys.every(k => checks.has(k));
        const someChecked = cat.subs.length === 0
          ? checks.has(cat.name)
          : subKeys.some(k => checks.has(k));

        // カテゴリ行
        const catRow = document.createElement('div');
        catRow.className = 'cat-row';
        catRow.innerHTML = `
          <div class="cb ${allChecked ? 'checked' : someChecked ? 'indeterminate' : ''}"></div>
          <div class="cat-label">${cat.name}</div>
          ${cat.subs.length > 0 ? `<div class="cat-toggle">${catOpen[cat.name] ? '▲' : '▼'}</div>` : ''}
        `;
        catRow.addEventListener('click', (e) => {
          if (cat.subs.length > 0) {
            // サブあり：チェック部分は全選択トグル、それ以外は開閉
            catOpen[cat.name] = !catOpen[cat.name];
            // チェックボックスエリアのクリックは全選択トグル
          }
          toggleCategory(cat, allChecked);
        });

        // チェックボックスのみクリックで全選択トグル（開閉は別）
        if (cat.subs.length > 0) {
          catRow.addEventListener('click', (e) => {
            // 既にtoggleCategoryが呼ばれているので追加処理不要
          });
          // チェックボックスだけ別イベント
          const cbEl = catRow.querySelector('.cb');
          cbEl.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleCategory(cat, allChecked);
            renderIngredientList();
          });
          // ラベル・トグルアイコンで開閉
          const labelEl = catRow.querySelector('.cat-label');
          const toggleEl = catRow.querySelector('.cat-toggle');
          [labelEl, toggleEl].forEach(el => {
            el.addEventListener('click', (e) => {
              e.stopPropagation();
              catOpen[cat.name] = !catOpen[cat.name];
              renderIngredientList();
            });
          });
          catRow.removeEventListener('click', catRow._handler);
          catRow._handler = null;
        }

        block.appendChild(catRow);

        // サブカテゴリリスト
        if (cat.subs.length > 0) {
          const subList = document.createElement('div');
          subList.className = 'sub-list' + (catOpen[cat.name] ? ' open' : '');
          cat.subs.forEach(sub => {
            const key = cat.name + '::' + sub;
            const isChecked = checks.has(key);
            const subRow = document.createElement('div');
            subRow.className = 'sub-row';
            subRow.innerHTML = `
              <div class="cb ${isChecked ? 'checked' : ''}"></div>
              <div class="sub-label">${sub}</div>
            `;
            subRow.addEventListener('click', () => {
              toggleSub(key, isChecked, cat);
              renderIngredientList();
            });
            subList.appendChild(subRow);
          });
          block.appendChild(subList);
        }

        container.appendChild(block);
      });
    }

    function renderIngredientSearchResults(container, checks) {
      const sf = slots[currentSlot].seasonFilter;
      const st = normalizeJP(searchText);

      let pool = DATA.ingredients;
      if (sf) {
        pool = pool.filter(ing => ing.seasons.includes(sf) || ing.seasons.includes('通年'));
      }
      const matched = pool.filter(ing => ingMatches(ing, st));

      if (matched.length === 0) {
        container.innerHTML = '<div class="no-result">見つかりませんでした</div>';
        return;
      }

      matched.forEach(ing => {
        const key = '::' + ing.name;
        const isChecked = checks.has(key);
        const row = document.createElement('div');
        row.className = 'sub-row';
        const catLabel = ing.sub ? `${ing.category}・${ing.sub}` : ing.category;
        row.innerHTML = `
          <div class="cb ${isChecked ? 'checked' : ''}"></div>
          <div class="sub-label">${ing.name}</div>
          <div class="ing-cat-label">${catLabel}</div>
        `;
        row.addEventListener('click', () => {
          isChecked ? checks.delete(key) : checks.add(key);
          renderIngredientList();
          updateSlotDisplay(currentSlot);
        });
        container.appendChild(row);
      });
    }

    function toggleCategory(cat, allChecked) {
      const checks = slots[currentSlot].checks;
      if (cat.subs.length === 0) {
        allChecked ? checks.delete(cat.name) : checks.add(cat.name);
      } else {
        cat.subs.forEach(sub => {
          const key = cat.name + '::' + sub;
          allChecked ? checks.delete(key) : checks.add(key);
        });
      }
      renderIngredientList();
    }

    function toggleSub(key, isChecked, cat) {
      const checks = slots[currentSlot].checks;
      isChecked ? checks.delete(key) : checks.add(key);
    }

    // ---- 料理名リスト描画 ----
    function renderDishList() {
      const checks = slots[currentSlot].type === 'dish' ? slots[currentSlot].checks : new Set();
      const slot = slots[currentSlot];
      const container = document.getElementById('dish-list');
      container.innerHTML = '';

      let pool = DATA.dishes;
      if (slot.dishTempFilter)   pool = pool.filter(d => d.temp && d.temp.includes(slot.dishTempFilter));
      if (slot.dishCourseFilter) pool = pool.filter(d => d.course && d.course.includes(slot.dishCourseFilter));
      if (slot.dishMethodFilter) pool = pool.filter(d => d.method && d.method.includes(slot.dishMethodFilter));

      const availableOrigins = DATA.origins.filter(o => pool.some(d => d.origins.includes(o)));

      const list = document.createElement('div');
      list.className = 'origin-list';

      if (availableOrigins.length === 0) {
        list.innerHTML = '<div class="no-result">該当する料理がありません</div>';
      } else {
        availableOrigins.forEach(origin => {
          const isChecked = checks.has(origin);
          const row = document.createElement('div');
          row.className = 'origin-row';
          row.innerHTML = `
            <div class="cb ${isChecked ? 'checked' : ''}"></div>
            <div class="origin-label">${origin}</div>
          `;
          row.addEventListener('click', () => {
            isChecked ? checks.delete(origin) : checks.add(origin);
            renderDishList();
            updateSlotDisplay(currentSlot);
          });
          list.appendChild(row);
        });
      }
      container.appendChild(list);
    }

    // ---- リセット ----
    function resetSheet() {
      slots[currentSlot].checks.clear();
      slots[currentSlot].seasonFilter = null;
      slots[currentSlot].dishTempFilter = null;
      slots[currentSlot].dishCourseFilter = null;
      slots[currentSlot].dishMethodFilter = null;
      syncSeasonPills();
      syncDishPills();
      renderIngredientList();
      renderDishList();
    }

    // ---- 決定 ----
    function confirmSheet() {
      slots[currentSlot].type = sheetType;
      if (sheetType === 'dish') {
        slots[currentSlot].seasonFilter = null;
      }
      if (sheetType === 'ingredient') {
        slots[currentSlot].dishTempFilter = null;
        slots[currentSlot].dishCourseFilter = null;
        slots[currentSlot].dishMethodFilter = null;
      }
      updateSlotDisplay(currentSlot);
      closeSheet();
    }

    function updateSlotDisplay(index) {
      const slot = slots[index];
      const checks = slot.checks;
      const seasonLabel = slot.type === 'ingredient' && slot.seasonFilter ? `${slot.seasonFilter}の` : '';
      let typeLabel;
      if (slot.type === 'ingredient') {
        typeLabel = `${seasonLabel}食材`;
      } else {
        const dishParts = [slot.dishTempFilter, slot.dishCourseFilter, slot.dishMethodFilter].filter(Boolean);
        const dishLabel = dishParts.length > 0 ? `${dishParts.join('・')}の` : '';
        typeLabel = `${dishLabel}料理名`;
      }
      const slotEl = document.getElementById(`slot-${index === 0 ? 'a' : 'b'}`);
      const typeEl = document.getElementById(`slot-${index === 0 ? 'a' : 'b'}-type`);
      const valEl  = document.getElementById(`slot-${index === 0 ? 'a' : 'b'}-value`);

      const hasDishFilter = slot.dishTempFilter || slot.dishCourseFilter || slot.dishMethodFilter;
      const hasFilter = checks.size > 0 || slot.seasonFilter || hasDishFilter;
      if (!hasFilter) {
        typeEl.textContent = '';
        valEl.textContent = '？';
        slotEl.classList.remove('filled');
      } else {
        typeEl.textContent = typeLabel;
        if (checks.size === 0) {
          valEl.textContent = 'すべて';
        } else {
          const labels = [...checks].map(k =>
            k.startsWith('::') ? k.slice(2) : k.includes('::') ? k.split('::')[1] : k
          );
          valEl.textContent = labels.slice(0, 3).join('・') + (labels.length > 3 ? '…' : '');
        }
        slotEl.classList.add('filled');
      }
    }

    // ---- 生成 ----
    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function getPool(slot) {
      if (slot.type === 'ingredient') {
        let pool = DATA.ingredients;
        if (slot.seasonFilter) {
          pool = pool.filter(ing =>
            ing.seasons.includes(slot.seasonFilter) || ing.seasons.includes('通年')
          );
        }
        const checks = slot.checks;
        if (checks.size === 0) return pool;
        return pool.filter(ing => {
          for (const key of checks) {
            if (key.startsWith('::')) {
              if (ing.name === key.slice(2)) return true;
            } else if (key.includes('::')) {
              const [cat, sub] = key.split('::');
              if (ing.category === cat && ing.sub === sub) return true;
            } else {
              if (ing.category === key) return true;
            }
          }
          return false;
        });
      } else {
        let pool = DATA.dishes;
        if (slot.dishTempFilter)   pool = pool.filter(d => d.temp && d.temp.includes(slot.dishTempFilter));
        if (slot.dishCourseFilter) pool = pool.filter(d => d.course && d.course.includes(slot.dishCourseFilter));
        if (slot.dishMethodFilter) pool = pool.filter(d => d.method && d.method.includes(slot.dishMethodFilter));
        const checks = slot.checks;
        if (checks.size === 0) return pool;
        return pool.filter(d => d.origins.some(o => checks.has(o)));
      }
    }

    function generate() {
      const poolA = getPool(slots[0]);
      const poolB = getPool(slots[1]);
      if (!poolA.length || !poolB.length) {
        document.getElementById('result-area').innerHTML =
          '<div class="result-hint">条件に合う候補がありません</div>';
        return;
      }
      const pairs = Array.from({ length: 5 }, () => ({
        a: pickRandom(poolA).name,
        b: pickRandom(poolB).name,
      }));
      const bubbles = pairs.map(p => `
        <div class="bubble">
          <span class="b-a">${p.a}</span>
          <span class="b-sep">×</span>
          <span class="b-b">${p.b}</span>
        </div>`).join('');
      document.getElementById('result-area').innerHTML =
        `<div class="bubble-area">${bubbles}</div>`;
    }

    // 初期表示
    updateSlotDisplay(0);
    updateSlotDisplay(1);
  </script>
</body>
</html>
