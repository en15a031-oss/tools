<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新メニューアイデアジェネレーター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #fafaf8;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 36px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }

    .mode-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #888;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .mode-tab {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid #ddd;
      background: #fff;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
      color: #555;
    }

    .mode-tab.active {
      background: #2c2c2c;
      border-color: #2c2c2c;
      color: #fff;
    }

    .filter-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-group {
      flex: 1;
      min-width: 120px;
    }

    .filter-group label {
      display: block;
      font-size: 0.72rem;
      color: #888;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .filter-group select,
    .filter-group input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.88rem;
      background: #fafafa;
      color: #2c2c2c;
      appearance: none;
    }

    .filter-group select:focus,
    .filter-group input:focus {
      outline: none;
      border-color: #aaa;
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      background: #2c2c2c;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s;
    }

    .generate-btn:hover {
      background: #444;
    }

    .result-area {
      margin-top: 20px;
    }

    .result-hint {
      font-size: 0.78rem;
      color: #aaa;
      text-align: center;
      padding: 20px 0;
    }

    .bubble-area {
      position: relative;
      width: 100%;
      height: 340px;
    }

    .bubble {
      position: absolute;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 14px;
      background: #fff;
      box-shadow:
        0 0 0 2px rgba(190, 210, 245, 0.25),
        0 0 14px 7px rgba(180, 205, 240, 0.28),
        0 0 32px 16px rgba(180, 205, 240, 0.12);
    }

    .bubble:nth-child(1) { left: calc(20% - 59px); top: 8px;   }
    .bubble:nth-child(2) { left: calc(80% - 59px); top: 4px;   }
    .bubble:nth-child(3) { left: calc(50% - 59px); top: 111px; }
    .bubble:nth-child(4) { left: calc(20% - 59px); top: 214px; }
    .bubble:nth-child(5) { left: calc(80% - 59px); top: 210px; }

    .b-ingredient {
      font-size: 0.78rem;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.3;
      word-break: break-all;
    }

    .b-sep {
      font-size: 0.62rem;
      color: #ccc;
      margin: 3px 0;
    }

    .b-dish {
      font-size: 0.78rem;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.3;
      word-break: break-all;
    }

    .hidden { display: none; }

    .filter-group { position: relative; }

    .suggest-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1.5px solid #aaa;
      border-top: none;
      border-radius: 0 0 10px 10px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    .suggest-list.open { display: block; }
    .suggest-item {
      padding: 9px 12px;
      font-size: 0.88rem;
      cursor: pointer;
      color: #2c2c2c;
    }
    .suggest-item:hover,
    .suggest-item.active { background: #f0f0ee; }
  </style>
</head>
<body>

  <h1>新メニューアイデア</h1>
  <p class="subtitle">ランダムな組み合わせから発想のきっかけを</p>

  <div class="card">

    <div class="mode-label">モード</div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="full-random">完全ランダム</button>
      <button class="mode-tab" data-mode="fix-ingredient">食材固定</button>
      <button class="mode-tab" data-mode="fix-dish">料理名固定</button>
      <button class="mode-tab" data-mode="season">季節しばり</button>
      <button class="mode-tab" data-mode="origin">国籍しばり</button>
    </div>

    <!-- 食材固定 -->
    <div class="filter-row hidden" id="filter-ingredient">
      <div class="filter-group">
        <label>食材（入力して絞り込み、または自由入力）</label>
        <input type="text" id="select-ingredient" placeholder="例：トマト" autocomplete="off">
      </div>
    </div>

    <!-- 料理名固定 -->
    <div class="filter-row hidden" id="filter-dish">
      <div class="filter-group">
        <label>料理名（入力して絞り込み、または自由入力）</label>
        <input type="text" id="select-dish" placeholder="例：リゾット" autocomplete="off">
      </div>
    </div>

    <!-- 季節しばり -->
    <div class="filter-row hidden" id="filter-season">
      <div class="filter-group">
        <label>季節</label>
        <select id="select-season">
          <option value="">選択してください</option>
        </select>
      </div>
    </div>

    <!-- 国籍しばり -->
    <div class="filter-row hidden" id="filter-origin">
      <div class="filter-group">
        <label>国籍・ジャンル</label>
        <select id="select-origin">
          <option value="">選択してください</option>
        </select>
      </div>
    </div>

    <button class="generate-btn" id="generate-btn">アイデアを出す</button>

    <div class="result-area" id="result-area">
      <div class="result-hint">ボタンを押すと組み合わせが出ます</div>
    </div>

  </div>

  <script src="data.js"></script>
  <script>
    let currentMode = 'full-random';

    // --- 表記ゆれ正規化（ひらがな→カタカナに統一して比較）---
    function toKatakana(str) {
      return str.replace(/[\u3041-\u3096]/g, ch =>
        String.fromCharCode(ch.charCodeAt(0) + 0x60)
      );
    }
    function normalize(str) {
      return toKatakana(str.toLowerCase());
    }
    function matches(candidate, query) {
      return normalize(candidate).includes(normalize(query));
    }

    // --- カスタムサジェスト ---
    function setupAutocomplete(inputId, names) {
      const input = document.getElementById(inputId);
      const list = document.createElement('div');
      list.className = 'suggest-list';
      input.parentNode.appendChild(list);

      let activeIndex = -1;

      function renderList(query) {
        activeIndex = -1;
        if (!query) { list.classList.remove('open'); return; }
        const matched = names.filter(n => matches(n, query)).slice(0, 12);
        if (!matched.length) { list.classList.remove('open'); return; }
        list.innerHTML = matched.map(n => `<div class="suggest-item">${n}</div>`).join('');
        list.classList.add('open');
        list.querySelectorAll('.suggest-item').forEach(item => {
          item.addEventListener('mousedown', e => {
            e.preventDefault();
            input.value = item.textContent;
            list.classList.remove('open');
          });
        });
      }

      input.addEventListener('input', () => renderList(input.value.trim()));

      input.addEventListener('keydown', e => {
        const items = list.querySelectorAll('.suggest-item');
        if (!items.length) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeIndex = Math.min(activeIndex + 1, items.length - 1);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeIndex = Math.max(activeIndex - 1, 0);
        } else if (e.key === 'Enter' && activeIndex >= 0) {
          e.preventDefault();
          input.value = items[activeIndex].textContent;
          list.classList.remove('open');
          activeIndex = -1;
          return;
        } else if (e.key === 'Escape') {
          list.classList.remove('open');
          return;
        }
        items.forEach((item, i) => item.classList.toggle('active', i === activeIndex));
      });

      input.addEventListener('blur', () => {
        setTimeout(() => list.classList.remove('open'), 150);
      });
    }

    // セレクトボックスを初期化
    function initSelects() {
      setupAutocomplete('select-ingredient', DATA.ingredients.map(i => i.name));
      setupAutocomplete('select-dish', DATA.dishes.map(d => d.name));

      const seasonSelect = document.getElementById('select-season');
      DATA.seasons.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        seasonSelect.appendChild(opt);
      });

      const originSelect = document.getElementById('select-origin');
      DATA.origins.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o;
        opt.textContent = o;
        originSelect.appendChild(opt);
      });
    }

    // モード切り替え
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;

        // フィルター表示切り替え
        document.getElementById('filter-ingredient').classList.add('hidden');
        document.getElementById('filter-dish').classList.add('hidden');
        document.getElementById('filter-season').classList.add('hidden');
        document.getElementById('filter-origin').classList.add('hidden');

        if (currentMode === 'fix-ingredient') document.getElementById('filter-ingredient').classList.remove('hidden');
        if (currentMode === 'fix-dish') document.getElementById('filter-dish').classList.remove('hidden');
        if (currentMode === 'season') document.getElementById('filter-season').classList.remove('hidden');
        if (currentMode === 'origin') document.getElementById('filter-origin').classList.remove('hidden');

        document.getElementById('result-area').innerHTML = '<div class="result-hint">ボタンを押すと組み合わせが出ます</div>';
      });
    });

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function showResults(pairs) {
      const area = document.getElementById('result-area');
      const bubbles = pairs.map(p => `
        <div class="bubble">
          <span class="b-ingredient">${p.ingredient}</span>
          <span class="b-sep">×</span>
          <span class="b-dish">${p.dish}</span>
        </div>`).join('');
      area.innerHTML = `<div class="bubble-area">${bubbles}</div>`;
    }

    function showError(msg) {
      document.getElementById('result-area').innerHTML = `<div class="result-hint">${msg}</div>`;
    }

    document.getElementById('generate-btn').addEventListener('click', () => {
      if (currentMode === 'full-random') {
        const pairs = Array.from({ length: 5 }, () => {
          const ingredient = pickRandom(DATA.ingredients);
          const dish = pickRandom(DATA.dishes);
          return { ingredient: ingredient.name, dish: dish.name, tags: [...new Set([...ingredient.seasons, ...dish.origins])] };
        });
        showResults(pairs);

      } else if (currentMode === 'fix-ingredient') {
        const val = document.getElementById('select-ingredient').value.trim();
        if (!val) return showError('食材を入力してください');
        const found = DATA.ingredients.find(i => i.name === val);
        const ingredient = found ? found : { name: val, seasons: [] };
        const pairs = Array.from({ length: 5 }, () => {
          const dish = pickRandom(DATA.dishes);
          return { ingredient: ingredient.name, dish: dish.name, tags: [...new Set([...ingredient.seasons, ...dish.origins])] };
        });
        showResults(pairs);

      } else if (currentMode === 'fix-dish') {
        const val = document.getElementById('select-dish').value.trim();
        if (!val) return showError('料理名を入力してください');
        const found = DATA.dishes.find(d => d.name === val);
        const dish = found ? found : { name: val, origins: [] };
        const pairs = Array.from({ length: 5 }, () => {
          const ingredient = pickRandom(DATA.ingredients);
          return { ingredient: ingredient.name, dish: dish.name, tags: [...new Set([...ingredient.seasons, ...dish.origins])] };
        });
        showResults(pairs);

      } else if (currentMode === 'season') {
        const val = document.getElementById('select-season').value;
        if (!val) return showError('季節を選んでください');
        const filtered = DATA.ingredients.filter(i => i.seasons.includes(val) || i.seasons.includes('通年'));
        if (!filtered.length) return showError('該当する食材がありません');
        const pairs = Array.from({ length: 5 }, () => {
          const ingredient = pickRandom(filtered);
          const dish = pickRandom(DATA.dishes);
          return { ingredient: ingredient.name, dish: dish.name, tags: [...new Set([val, ...dish.origins])] };
        });
        showResults(pairs);

      } else if (currentMode === 'origin') {
        const val = document.getElementById('select-origin').value;
        if (!val) return showError('国籍を選んでください');
        const filtered = DATA.dishes.filter(d => d.origins.includes(val));
        if (!filtered.length) return showError('該当する料理がありません');
        const pairs = Array.from({ length: 5 }, () => {
          const dish = pickRandom(filtered);
          const ingredient = pickRandom(DATA.ingredients);
          return { ingredient: ingredient.name, dish: dish.name, tags: [...new Set([...ingredient.seasons, val])] };
        });
        showResults(pairs);
      }
    });

    initSelects();
  </script>
</body>
</html>
