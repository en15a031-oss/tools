<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廃棄ロストラッカー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #fafaf8;
      color: #2c2c2c;
      min-height: 100vh;
    }

    /* ヘッダー */
    .app-header {
      background: #fff;
      border-bottom: 1px solid #f0f0ee;
      padding: 16px 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner { max-width: 560px; margin: 0 auto; }

    .back-link {
      display: inline-block;
      font-size: 0.75rem;
      color: #bbb;
      text-decoration: none;
      margin-bottom: 8px;
    }

    .back-link:hover { color: #555; }

    .app-header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .app-header .subtitle {
      font-size: 0.72rem;
      color: #bbb;
      margin-bottom: 10px;
    }

    .tabs { display: flex; }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      color: #bbb;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      font-family: inherit;
    }

    .tab-btn.active { color: #2c2c2c; border-bottom-color: #2c2c2c; }

    /* コンテンツ */
    .tab-content {
      display: none;
      padding: 16px 16px 60px;
      max-width: 560px;
      margin: 0 auto;
    }

    .tab-content.active { display: block; }

    /* カード */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 0.7rem;
      font-weight: 600;
      color: #aaa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* フォーム */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-group { margin-bottom: 10px; }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 5px;
    }

    .form-group label .opt {
      font-size: 0.68rem;
      color: #ccc;
      font-weight: 400;
      margin-left: 3px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid #e8e8e8;
      border-radius: 10px;
      font-size: 0.9rem;
      background: #fafafa;
      color: #2c2c2c;
      font-family: inherit;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #aaa;
      background: #fff;
    }

    .form-group textarea { resize: none; height: 56px; }

    /* ボタン */
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: #2c2c2c;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: background 0.15s;
      font-family: inherit;
    }

    .btn-primary:hover { background: #444; }

    .btn-secondary {
      padding: 9px 14px;
      background: none;
      color: #666;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .btn-secondary:hover { color: #333; border-color: #aaa; }

    .btn-danger {
      padding: 9px 14px;
      background: none;
      color: #e53935;
      border: 1.5px solid #ffcdd2;
      border-radius: 10px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .btn-danger:hover { background: #fdecea; }

    /* 折りたたみフォーム */
    .toggle-form-btn {
      width: 100%;
      padding: 12px;
      background: none;
      border: 1.5px dashed #e0e0e0;
      border-radius: 12px;
      font-size: 0.85rem;
      color: #aaa;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      font-family: inherit;
      margin-bottom: 14px;
    }

    .toggle-form-btn:hover { color: #555; border-color: #aaa; }

    .collapsible { display: none; }
    .collapsible.open { display: block; }

    /* 在庫アイテム */
    .inv-item {
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1.5px solid transparent;
    }

    .inv-item:last-child { margin-bottom: 0; }

    .inv-item.status-expired {
      background: #fdecea;
      border-color: #ffcdd2;
    }

    .inv-item.status-today {
      background: #fdecea;
      border-color: #ef9a9a;
    }

    .inv-item.status-soon {
      background: #fff8e1;
      border-color: #ffe082;
    }

    .inv-item.status-ok {
      background: #fafaf8;
      border-color: #f0f0ee;
    }

    .inv-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .inv-name {
      flex: 1;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .inv-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .status-expired .inv-badge,
    .status-today   .inv-badge { background: #e53935; color: #fff; }
    .status-soon    .inv-badge { background: #fb8c00; color: #fff; }
    .status-ok      .inv-badge { background: #e0e0e0; color: #555; }

    .inv-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 0.78rem;
      color: #888;
    }

    .inv-meta .sep { color: #ccc; }

    .inv-actions { display: flex; gap: 8px; }

    .inv-btn-waste {
      flex: 1;
      padding: 9px;
      background: #2c2c2c;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .inv-btn-waste:hover { background: #e53935; }

    .inv-btn-used {
      flex: 1;
      padding: 9px;
      background: none;
      color: #888;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .inv-btn-used:hover { color: #2e7d32; border-color: #a5d6a7; background: #e8f5e9; }

    .inv-btn-del {
      padding: 9px 12px;
      background: none;
      color: #ddd;
      border: 1.5px solid #eeeeee;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .inv-btn-del:hover { color: #e53935; border-color: #ffcdd2; }

    /* 廃棄ログ */
    .log-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0ee;
    }

    .log-item:last-child { border-bottom: none; }

    .log-date {
      font-size: 0.7rem;
      color: #bbb;
      white-space: nowrap;
      padding-top: 3px;
      min-width: 60px;
    }

    .log-main { flex: 1; min-width: 0; }

    .log-name {
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .log-detail {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      font-size: 0.75rem;
      color: #888;
    }

    .log-category {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 0.66rem;
    }

    .log-memo { font-size: 0.72rem; color: #bbb; margin-top: 2px; }

    .log-delete {
      background: none;
      border: none;
      color: #ddd;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px 6px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .log-delete:hover { color: #e53935; }

    /* サマリー */
    .stats-row { display: flex; gap: 10px; }

    .stat-item {
      flex: 1;
      background: #fafaf8;
      border-radius: 12px;
      padding: 13px 8px;
      text-align: center;
    }

    .stat-num {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label { font-size: 0.66rem; color: #aaa; }

    /* 棒グラフ */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
    }

    .bar-row:last-child { margin-bottom: 0; }

    .bar-label {
      font-size: 0.8rem;
      width: 72px;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #444;
    }

    .bar-track {
      flex: 1;
      height: 8px;
      background: #f0f0ee;
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #2c2c2c;
      border-radius: 99px;
      transition: width 0.5s ease;
    }

    .bar-count {
      font-size: 0.75rem;
      color: #888;
      min-width: 24px;
      text-align: right;
    }

    /* カテゴリ色 */
    .cat-肉     { background: #fce4ec; color: #c62828; }
    .cat-魚介   { background: #e3f2fd; color: #1565c0; }
    .cat-野菜   { background: #e8f5e9; color: #2e7d32; }
    .cat-きのこ { background: #f3e5f5; color: #6a1b9a; }
    .cat-果物   { background: #fff8e1; color: #e65100; }
    .cat-乳製品 { background: #e8eaf6; color: #283593; }
    .cat-調味料 { background: #fbe9e7; color: #bf360c; }
    .cat-その他 { background: #f0f0ee; color: #555; }

    /* 空状態 */
    .empty {
      text-align: center;
      padding: 28px 16px;
      color: #ccc;
      font-size: 0.82rem;
    }

    /* トースト */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #2c2c2c;
      color: #fff;
      padding: 11px 22px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 期限フィルター */
    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid #e0e0e0;
      background: none;
      color: #888;
      transition: all 0.15s;
      font-family: inherit;
    }

    .filter-btn.active { background: #2c2c2c; color: #fff; border-color: #2c2c2c; }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="header-inner">
      <a class="back-link" href="../">← ツール一覧</a>
      <h1>廃棄ロストラッカー</h1>
      <p class="subtitle">食材の期限管理から廃棄記録・ロス可視化まで</p>
      <div class="tabs">
        <button class="tab-btn active" data-tab="inv">在庫・期限</button>
        <button class="tab-btn" data-tab="log">廃棄ログ</button>
        <button class="tab-btn" data-tab="data">データ管理</button>
      </div>
    </div>
  </div>

  <!-- 在庫・期限タブ -->
  <div class="tab-content active" id="tab-inv">

    <button class="toggle-form-btn" id="toggle-inv-form">＋ 食材を登録する</button>

    <div class="collapsible" id="inv-form-wrap">
      <div class="card">
        <div class="card-title">仕入れ登録</div>

        <div class="form-row">
          <div class="form-group">
            <label>食材名</label>
            <input type="text" id="i-name" placeholder="例: トマト">
          </div>
          <div class="form-group">
            <label>カテゴリ<span class="opt">任意</span></label>
            <select id="i-category">
              <option value="">未選択</option>
              <option>肉</option>
              <option>魚介</option>
              <option>野菜</option>
              <option>きのこ</option>
              <option>果物</option>
              <option>乳製品</option>
              <option>調味料</option>
              <option>その他</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>消費期限</label>
            <input type="date" id="i-expiry">
          </div>
          <div class="form-group">
            <label>仕入れ量<span class="opt">任意</span></label>
            <input type="text" id="i-amount" placeholder="例: 500g、10個">
          </div>
        </div>

        <div class="form-group">
          <label>メモ<span class="opt">任意</span></label>
          <textarea id="i-memo" placeholder="仕入れ先・用途など"></textarea>
        </div>

        <button class="btn-primary" id="btn-inv-save">登録する</button>
      </div>
    </div>

    <!-- フィルター -->
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="alert">要注意のみ</button>
    </div>

    <div id="inv-list"></div>

  </div>

  <!-- 廃棄ログタブ -->
  <div class="tab-content" id="tab-log">

    <button class="toggle-form-btn" id="toggle-log-form">＋ 手動で廃棄を記録</button>

    <div class="collapsible" id="log-form-wrap">
      <div class="card">
        <div class="card-title">廃棄を直接記録（在庫に登録していない食材など）</div>

        <div class="form-row">
          <div class="form-group">
            <label>日付</label>
            <input type="date" id="l-date">
          </div>
          <div class="form-group">
            <label>カテゴリ<span class="opt">任意</span></label>
            <select id="l-category">
              <option value="">未選択</option>
              <option>肉</option>
              <option>魚介</option>
              <option>野菜</option>
              <option>きのこ</option>
              <option>果物</option>
              <option>乳製品</option>
              <option>調味料</option>
              <option>その他</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>食材名</label>
            <input type="text" id="l-name" placeholder="例: トマト">
          </div>
          <div class="form-group">
            <label>廃棄量</label>
            <input type="text" id="l-amount" placeholder="例: 300g、3個">
          </div>
        </div>

        <div class="form-group">
          <label>メモ<span class="opt">任意</span></label>
          <textarea id="l-memo" placeholder="廃棄の理由など"></textarea>
        </div>

        <button class="btn-primary" id="btn-log-save">記録する</button>
      </div>
    </div>

    <!-- ダッシュボード -->
    <div class="card">
      <div class="card-title">廃棄件数サマリー</div>
      <div class="stats-row" id="stats-row"></div>
    </div>

    <div class="card">
      <div class="card-title">廃棄回数ランキング（上位10食材）</div>
      <div id="rank-chart"></div>
    </div>

    <div class="card">
      <div class="card-title">カテゴリ別件数</div>
      <div id="cat-chart"></div>
    </div>

    <div class="card">
      <div class="card-title" id="log-list-title">廃棄ログ</div>
      <div id="log-list"></div>
    </div>

  </div>

  <!-- データ管理タブ -->
  <div class="tab-content" id="tab-data">

    <div class="card">
      <div class="card-title">バックアップ</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn-secondary" id="btn-export">JSONで書き出す</button>
        <label class="btn-secondary" style="cursor:pointer; display:inline-block;">
          JSONを読み込む
          <input type="file" id="inp-import" accept=".json" style="display:none;">
        </label>
      </div>
      <p style="font-size:0.72rem; color:#bbb; margin-top:12px; line-height:1.7;">
        在庫データと廃棄ログを両方まとめて書き出します。<br>
        別のデバイスへの移行は読み込みから。
      </p>
    </div>

    <div class="card" style="border:1.5px solid #ffcdd2;">
      <div class="card-title" style="color:#e53935;">危険ゾーン</div>
      <p style="font-size:0.8rem; color:#aaa; margin-bottom:14px; line-height:1.7;">
        すべてのデータ（在庫・廃棄ログ）を削除します。<br>元に戻せません。
      </p>
      <button class="btn-danger" id="btn-clear">すべて削除する</button>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const INV_KEY   = 'waste-tracker-inventory-v1';
    const WASTE_KEY = 'waste-tracker-v1';

    // --- ストレージ ---
    function loadInv()       { try { return JSON.parse(localStorage.getItem(INV_KEY)   || '[]'); } catch { return []; } }
    function loadWaste()     { try { return JSON.parse(localStorage.getItem(WASTE_KEY) || '[]'); } catch { return []; } }
    function saveInv(d)      { localStorage.setItem(INV_KEY,   JSON.stringify(d)); }
    function saveWaste(d)    { localStorage.setItem(WASTE_KEY, JSON.stringify(d)); }

    // --- 日付ユーティリティ ---
    function todayStr() {
      const d = new Date();
      return [d.getFullYear(), pad(d.getMonth()+1), pad(d.getDate())].join('-');
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    function daysUntil(dateStr) {
      const today = new Date(todayStr());
      const target = new Date(dateStr);
      return Math.round((target - today) / 86400000);
    }

    function expiryStatus(dateStr) {
      const d = daysUntil(dateStr);
      if (d < 0)  return 'expired';
      if (d === 0) return 'today';
      if (d <= 3)  return 'soon';
      return 'ok';
    }

    function expiryLabel(dateStr) {
      const d = daysUntil(dateStr);
      if (d < 0)  return '期限切れ';
      if (d === 0) return '今日まで';
      if (d <= 3)  return 'あと' + d + '日';
      return dateStr + ' まで';
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function catClass(c) { return 'log-category ' + (c ? 'cat-' + c : 'cat-その他'); }

    // --- 折りたたみフォーム ---
    function setupToggle(btnId, wrapId) {
      document.getElementById(btnId).addEventListener('click', () => {
        const wrap = document.getElementById(wrapId);
        const btn  = document.getElementById(btnId);
        const open = wrap.classList.toggle('open');
        btn.textContent = open ? '▲ 閉じる' : '＋ ' + (btnId === 'toggle-inv-form' ? '食材を登録する' : '手動で廃棄を記録');
      });
    }

    setupToggle('toggle-inv-form', 'inv-form-wrap');
    setupToggle('toggle-log-form', 'log-form-wrap');

    // --- 初期値 ---
    document.getElementById('i-expiry').value = todayStr();
    document.getElementById('l-date').value   = todayStr();

    // ===== 在庫・期限 =====

    document.getElementById('btn-inv-save').addEventListener('click', () => {
      const name     = document.getElementById('i-name').value.trim();
      const expiry   = document.getElementById('i-expiry').value;
      const category = document.getElementById('i-category').value;
      const amount   = document.getElementById('i-amount').value.trim();
      const memo     = document.getElementById('i-memo').value.trim();

      if (!name)   { alert('食材名を入力してください'); return; }
      if (!expiry) { alert('消費期限を入力してください'); return; }

      const inv = loadInv();
      inv.push({ id: Date.now(), name, category, amount, expiry, memo });
      // 期限順に並べ直す
      inv.sort((a, b) => a.expiry.localeCompare(b.expiry));
      saveInv(inv);

      document.getElementById('i-name').value   = '';
      document.getElementById('i-amount').value = '';
      document.getElementById('i-memo').value   = '';
      document.getElementById('i-name').focus();

      showToast('登録しました');
      renderInv();
    });

    let invFilter = 'all';

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        invFilter = btn.dataset.filter;
        renderInv();
      });
    });

    function renderInv() {
      let items = loadInv();
      if (invFilter === 'alert') {
        items = items.filter(i => expiryStatus(i.expiry) !== 'ok');
      }

      const el = document.getElementById('inv-list');

      if (!items.length) {
        el.innerHTML = '<div class="empty">' +
          (invFilter === 'alert' ? '要注意の食材はありません' : '食材が登録されていません') +
          '</div>';
        return;
      }

      el.innerHTML = items.map(item => {
        const status = expiryStatus(item.expiry);
        const badge  = expiryLabel(item.expiry);
        return `<div class="inv-item status-${status}" data-id="${item.id}">
          <div class="inv-header">
            <div class="inv-name">${esc(item.name)}</div>
            <span class="inv-badge">${badge}</span>
          </div>
          <div class="inv-meta">
            ${item.amount ? '<span>' + esc(item.amount) + '</span><span class="sep">·</span>' : ''}
            <span>${item.category || 'カテゴリ未設定'}</span>
            ${item.memo ? '<span class="sep">·</span><span>' + esc(item.memo) + '</span>' : ''}
          </div>
          <div class="inv-actions">
            <button class="inv-btn-waste" data-id="${item.id}">廃棄する</button>
            <button class="inv-btn-used"  data-id="${item.id}">使いきった</button>
            <button class="inv-btn-del"   data-id="${item.id}">削除</button>
          </div>
        </div>`;
      }).join('');
    }

    // 在庫アクション（委譲）
    document.getElementById('inv-list').addEventListener('click', e => {
      const btn = e.target;
      const id  = parseInt(btn.dataset.id);
      if (!id) return;

      if (btn.classList.contains('inv-btn-waste')) {
        handleWaste(id);
      } else if (btn.classList.contains('inv-btn-used')) {
        handleUsed(id);
      } else if (btn.classList.contains('inv-btn-del')) {
        handleInvDel(id);
      }
    });

    function handleWaste(id) {
      const inv  = loadInv();
      const item = inv.find(i => i.id === id);
      if (!item) return;
      if (!confirm(`「${item.name}」を廃棄しますか？\n廃棄ログに記録されます。`)) return;

      // 廃棄ログに追加
      const waste = loadWaste();
      waste.unshift({
        id: Date.now(),
        date: todayStr(),
        name: item.name,
        amount: item.amount,
        category: item.category,
        memo: item.memo,
      });
      saveWaste(waste);

      // 在庫から削除
      saveInv(inv.filter(i => i.id !== id));

      showToast('廃棄ログに記録しました');
      renderInv();
    }

    function handleUsed(id) {
      const inv  = loadInv();
      const item = inv.find(i => i.id === id);
      if (!item) return;
      if (!confirm(`「${item.name}」を使いきりましたか？\n在庫から削除します。`)) return;
      saveInv(inv.filter(i => i.id !== id));
      showToast('使いきり完了');
      renderInv();
    }

    function handleInvDel(id) {
      const inv  = loadInv();
      const item = inv.find(i => i.id === id);
      if (!item) return;
      if (!confirm(`「${item.name}」を削除しますか？`)) return;
      saveInv(inv.filter(i => i.id !== id));
      showToast('削除しました');
      renderInv();
    }

    // ===== 廃棄ログ =====

    document.getElementById('btn-log-save').addEventListener('click', () => {
      const date     = document.getElementById('l-date').value;
      const name     = document.getElementById('l-name').value.trim();
      const amount   = document.getElementById('l-amount').value.trim();
      const category = document.getElementById('l-category').value;
      const memo     = document.getElementById('l-memo').value.trim();

      if (!date)   { alert('日付を入力してください'); return; }
      if (!name)   { alert('食材名を入力してください'); return; }
      if (!amount) { alert('廃棄量を入力してください'); return; }

      const waste = loadWaste();
      waste.unshift({ id: Date.now(), date, name, amount, category, memo });
      saveWaste(waste);

      document.getElementById('l-name').value   = '';
      document.getElementById('l-amount').value = '';
      document.getElementById('l-memo').value   = '';

      showToast('記録しました');
      renderLog();
    });

    function logItemHTML(log) {
      const cat = log.category || '';
      return `<div class="log-item">
        <div class="log-date">${esc(log.date)}</div>
        <div class="log-main">
          <div class="log-name">${esc(log.name)}</div>
          <div class="log-detail">
            ${log.amount ? '<span>' + esc(log.amount) + '</span>' : ''}
            <span class="${catClass(cat)}">${esc(cat || 'その他')}</span>
          </div>
          ${log.memo ? '<div class="log-memo">' + esc(log.memo) + '</div>' : ''}
        </div>
        <button class="log-delete" data-id="${log.id}">×</button>
      </div>`;
    }

    function barChart(entries, maxVal) {
      return entries.map(([label, cnt]) => `
        <div class="bar-row">
          <div class="bar-label" title="${esc(label)}">${esc(label)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(cnt/maxVal*100).toFixed(1)}%"></div></div>
          <div class="bar-count">${cnt}</div>
        </div>`).join('');
    }

    function renderLog() {
      const logs  = loadWaste();
      const today = todayStr();
      const month = today.slice(0, 7);

      // サマリー
      document.getElementById('stats-row').innerHTML = [
        [logs.filter(l => l.date === today).length,           '今日'],
        [logs.filter(l => l.date.startsWith(month)).length,   '今月'],
        [logs.length,                                         '累計'],
      ].map(([n, label]) => `
        <div class="stat-item">
          <div class="stat-num">${n}</div>
          <div class="stat-label">${label}</div>
        </div>`).join('');

      // ランキング
      const nameMap = {};
      logs.forEach(l => { nameMap[l.name] = (nameMap[l.name] || 0) + 1; });
      const ranked = Object.entries(nameMap).sort((a, b) => b[1] - a[1]).slice(0, 10);
      document.getElementById('rank-chart').innerHTML = ranked.length
        ? barChart(ranked, ranked[0][1])
        : '<div class="empty">記録がありません</div>';

      // カテゴリ
      const catMap = {};
      logs.forEach(l => { const c = l.category || 'その他'; catMap[c] = (catMap[c] || 0) + 1; });
      const catEntries = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
      document.getElementById('cat-chart').innerHTML = catEntries.length
        ? barChart(catEntries, catEntries[0][1])
        : '<div class="empty">記録がありません</div>';

      // ログ一覧
      document.getElementById('log-list-title').textContent = '廃棄ログ（' + logs.length + '件）';
      document.getElementById('log-list').innerHTML = logs.length
        ? logs.map(logItemHTML).join('')
        : '<div class="empty">記録がありません</div>';
    }

    // 廃棄ログ削除（委譲）
    document.getElementById('log-list').addEventListener('click', e => {
      if (!e.target.classList.contains('log-delete')) return;
      if (!confirm('この記録を削除しますか？')) return;
      const id = parseInt(e.target.dataset.id);
      saveWaste(loadWaste().filter(l => l.id !== id));
      showToast('削除しました');
      renderLog();
    });

    // ===== タブ切り替え =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'log') renderLog();
      });
    });

    // ===== データ管理 =====
    document.getElementById('btn-export').addEventListener('click', () => {
      const data = { inventory: loadInv(), wasteLogs: loadWaste() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'waste-tracker-' + todayStr() + '.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('inp-import').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);

          // 在庫マージ
          const existInv = loadInv();
          const invIds   = new Set(existInv.map(i => i.id));
          const newInv   = (d.inventory || []).filter(i => !invIds.has(i.id));
          const mergedInv = [...existInv, ...newInv].sort((a, b) => a.expiry.localeCompare(b.expiry));
          saveInv(mergedInv);

          // 廃棄ログマージ
          const existWaste = loadWaste();
          const wasteIds   = new Set(existWaste.map(l => l.id));
          const newWaste   = (d.wasteLogs || []).filter(l => !wasteIds.has(l.id));
          const mergedWaste = [...existWaste, ...newWaste].sort((a, b) =>
            b.date.localeCompare(a.date) || b.id - a.id
          );
          saveWaste(mergedWaste);

          showToast(`在庫${newInv.length}件・ログ${newWaste.length}件を読み込みました`);
          renderInv();
        } catch (err) {
          alert('読み込みに失敗しました。正しいJSONファイルを選択してください。');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      const invCount   = loadInv().length;
      const wasteCount = loadWaste().length;
      if (!invCount && !wasteCount) { alert('削除するデータがありません'); return; }
      if (!confirm(`在庫${invCount}件・廃棄ログ${wasteCount}件をすべて削除します。\n元に戻せません。本当によいですか？`)) return;
      localStorage.removeItem(INV_KEY);
      localStorage.removeItem(WASTE_KEY);
      showToast('すべて削除しました');
      renderInv();
      renderLog();
    });

    // ===== 初期描画 =====
    renderInv();
  </script>

</body>
</html>
